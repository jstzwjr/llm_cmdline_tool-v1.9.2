modelOptions:
  # Architecture
  promptTokenBatchSize: 128 # Prompt mode input token size. Example 128t.
  genTokenBatchSize: 1      # Generation mode input token size. Default to 1 if not set.
  cacheSize: 1024           # Cache size (context length) supported by the fixed-shape model.
  hiddenSize: 3072          # Model hidden size.
  numHead: 24               # Number of attention heads per layer (Ignore GQA when setting this).
  numLayer: 28              # Total number of layers in the model.
  maxTokenLength: 131072      # Max supported context length (aka max_position_embeddings).
  rotEmbBase: 500000        # Rotary embedding base value (aka rope_theta). Default to 10000.
  # Types
  modelInputType: INT16     # Input embedding type.
  modelOutputType: INT16    # Output logits type.
  cacheType: INT16          # Cache Input & Output type.
  maskType: INT16           # Input mask type.
  rotEmbType: INT16         # Input Rotary embedding type.


runtimeOptions:
  # Special tokens that affects the inference behavior.
  specialTokens:
    bosId: 128000      # BOS token Id, required to set.
    eosId: 128001      # EOS token Id, required to set.
    addBos: true       # Prepend BOS token during tokenization. Default to false if not set.
    stopToken: [128001, 128008, 128009]   # Inference stops once a stop token is generated. Either a list (e.g. EOS & EOT used by Llama3) or a value (usually EOS). Default to eosId if not set.

  tokenizerRegex: "(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\\p{L}\\p{N}]?\\p{L}+|\\p{N}{1,3}| ?[^\\s\\p{L}\\p{N}]+[\r\n]*|\\s*[\r\n]+|\\s+(?:$|[^\\S])|\\s+"

  tokenizerPath:
    - /data/local/tmp/llm_sdk/llama3.2/llama3.2_tokenizer.tiktoken
    - /data/local/tmp/llm_sdk/llama3.2/added_tokens.yaml

  tokenEmbPath: /data/local/tmp/llm_sdk/Llama3.2-3B-Instruct/embedding_int16.bin

  dlaPromptPaths:
    - /data/local/tmp/llm_sdk/Llama3.2-3B-Instruct/Llama3.2-3B-Instruct_sym4W_sym16A_Overall_hessian_28layer_128t1024c_0.dla
  dlaGenPaths:
    - /data/local/tmp/llm_sdk/Llama3.2-3B-Instruct/Llama3.2-3B-Instruct_sym4W_sym16A_Overall_hessian_28layer_1t1024c_0.dla
  sharedWeightsPaths:
    - /data/local/tmp/llm_sdk/Llama3.2-3B-Instruct/shared_weights_0.bin
