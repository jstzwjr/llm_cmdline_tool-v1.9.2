modelOptions:
  # Architecture
  promptTokenBatchSize: 128
  genTokenBatchSize: 8
  cacheSize: 1024
  hiddenSize: 4096
  numHead: 32
  numLayer: 32
  maxTokenLength: 4096
  rotEmbBase: 10000
  numMedusaHeads: 3
  # Types
  modelInputType: INT16
  modelOutputType: INT16
  cacheType: INT16
  maskType: INT16
  rotEmbType: INT16
  modelOutputQuantScale: 0.0007059040945023298  # Need to update according to user's PTQ result

runtimeOptions:
  # Special tokens that determines the inference behavior.
  specialTokens:
    bosId: 1      # BOS token Id, required to set.
    eosId: 2      # EOS token Id, required to set.
    addBos: true  # Prepend BOS token during tokenization. Default to false if not set.

  tokenizerPath:
    - /data/local/tmp/llm_sdk/medusa/tokenizer.model

  tokenEmbPath: /data/local/tmp/llm_sdk/medusa/emb_medusa_vicuna_7b.bin

  dlaPromptPaths:
    - /data/local/tmp/llm_sdk/medusa/128t1024c_0.dla
    - /data/local/tmp/llm_sdk/medusa/128t1024c_1.dla
    - /data/local/tmp/llm_sdk/medusa/128t1024c_2.dla
    - /data/local/tmp/llm_sdk/medusa/128t1024c_3.dla
  dlaGenPaths:
    - /data/local/tmp/llm_sdk/medusa/8t1024c_0.dla
    - /data/local/tmp/llm_sdk/medusa/8t1024c_1.dla
    - /data/local/tmp/llm_sdk/medusa/8t1024c_2.dla
    - /data/local/tmp/llm_sdk/medusa/8t1024c_3.dla
  dlaLmHeadPath: /data/local/tmp/llm_sdk/medusa/8t1024c_4.dla
  dlaMedusaHeadsPath: /data/local/tmp/llm_sdk/medusa/1t1024c_5.dla