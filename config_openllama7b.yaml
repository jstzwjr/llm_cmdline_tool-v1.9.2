modelOptions:
  # Architecture
  promptTokenBatchSize: 128
  cacheSize: 1024
  hiddenSize: 4096
  numHead: 32
  numLayer: 32
  maxTokenLength: 2048
  rotEmbBase: 10000
  # Types
  modelInputType: INT16
  modelOutputType: INT16
  cacheType: INT16
  maskType: INT16
  rotEmbType: INT16

runtimeOptions:
  # Special tokens that determines the inference behavior.
  specialTokens:
    bosId: 1      # BOS token Id, required to set.
    eosId: 2      # EOS token Id, required to set.
    addBos: true  # Prepend BOS token during tokenization. Default to false if not set.

  tokenizerPath: /data/local/tmp/llm_sdk/openllama/tokenizer.model

  tokenEmbPath: /data/local/tmp/llm_sdk/openllama/embedding_openllama_7b.bin

  dlaPromptPaths:
    - /data/local/tmp/llm_sdk/openllama/openllama_7b_sym4W_sym16A_Overall_adaround_32t512c_0.dla
    - /data/local/tmp/llm_sdk/openllama/openllama_7b_sym4W_sym16A_Overall_adaround_32t512c_1.dla
  dlaGenPaths:
    - /data/local/tmp/llm_sdk/openllama/openllama_7b_sym4W_sym16A_Overall_adaround_1t512c_0.dla
    - /data/local/tmp/llm_sdk/openllama/openllama_7b_sym4W_sym16A_Overall_adaround_1t512c_1.dla
  sharedWeightsPaths:
    - /data/local/tmp/llm_sdk/openllama/shared_weights_0.bin
    - /data/local/tmp/llm_sdk/openllama/shared_weights_1.bin