modelOptions:
  # Architecture
  promptTokenBatchSize: 128
  genTokenBatchSize: 1
  cacheSize: 1024
  hiddenSize: 3072
  numHead: 32
  numLayer: 32
  maxTokenLength: 4096
  rotEmbBase: 10000
  # Types
  modelInputType: INT16 # For DQ need to change to FP16
  modelOutputType: INT16
  cacheType: INT16
  maskType: INT16
  rotEmbType: INT16

runtimeOptions:
  startTokenIndex: 0

  # Special tokens that determines the inference behavior.
  specialTokens:
    bosId: 1      # BOS token Id, required to set.
    eosId: 32000      # EOS token Id, required to set.
    addBos: true  # Prepend BOS token during tokenization. Default to false if not set.

  tokenizerPath:
    - /data/local/tmp/llm_sdk/phi3/dlas/tokenizer_nodummyprefix.model
    - /data/local/tmp/llm_sdk/phi3/dlas/added_tokens.yaml

  tokenEmbPath: /data/local/tmp/llm_sdk/phi3/dlas/embedding_Phi-3-mini-4k-instruct_int16.bin

  dlaPromptPaths:
    - /data/local/tmp/llm_sdk/phi3/dlas/Phi-3-mini-4k-instruct_sym4W_sym16A_Overall_hessian_32layer_128t2048c.dla
  dlaGenPaths:
    - /data/local/tmp/llm_sdk/phi3/dlas/Phi-3-mini-4k-instruct_sym4W_sym16A_Overall_hessian_32layer_1t2048c.dla

  cachePaths: # One cache file per dla chunk, where each file is a concatenation of all caches in a chunk.
