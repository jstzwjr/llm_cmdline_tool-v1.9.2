modelOptions:
  # Architecture
  promptTokenBatchSize: 128
  genTokenBatchSize: 6
  cacheSize: 1024
  hiddenSize: 4096
  numHead: 32
  numLayer: 32
  maxTokenLength: 4096
  rotEmbBase: 10000
  # Types
  modelInputType: INT16
  modelOutputType: INT16
  cacheType: INT16
  maskType: INT16
  rotEmbType: INT16
  modelOutputQuantScale: 0.0010623723501339555  # Need to update according to user's PTQ result

runtimeOptions:
  # Special tokens that determines the inference behavior.
  specialTokens:
    bosId: 1      # BOS token Id, required to set.
    eosId: 2      # EOS token Id, required to set.
    addBos: true  # Prepend BOS token during tokenization. Default to false if not set.

  tokenizerPath:
    - /data/local/tmp/llm_sdk/vicuna_7b/tokenizer.model

  tokenEmbPath: /data/local/tmp/llm_sdk/vicuna_7b/embedding_vicuna-7b-v1.5.bin

  dlaPromptPaths:
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_128t1024c_0.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_128t1024c_1.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_128t1024c_2.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_128t1024c_3.dla
  dlaGenPaths:
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_6t1024c_0.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_6t1024c_1.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_6t1024c_2.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_6t1024c_3.dla