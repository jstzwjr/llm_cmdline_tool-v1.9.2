modelOptions:
  # Architecture
  promptTokenBatchSize: 128
  genTokenBatchSize: 8
  cacheSize: 2048
  hiddenSize: 4096
  numHead: 32
  numLayer: 32
  maxTokenLength: 4096
  rotEmbBase: 10000
  # Types
  modelInputType: INT16
  modelOutputType: INT16
  cacheType: INT8
  maskType: INT16
  rotEmbType: INT16
  modelOutputQuantScale: 0.0011230050586163998  # Need to update according to user's PTQ result

runtimeOptions:
  startTokenIndex: 0

  # Special tokens that determines the inference behavior.
  specialTokens:
    bosId: 1      # BOS token Id, required to set.
    eosId: 2      # EOS token Id, required to set.
    addBos: true  # Prepend BOS token during tokenization. Default to false if not set.

  tokenizerPath:
    - /data/local/tmp/llm_sdk/vicuna_7b/tokenizer.model

  tokenEmbPath: /data/local/tmp/llm_sdk/vicuna_7b/embedding_vicuna-7b-v1.5.bin

  dlaPromptPaths:
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_128t2048c_0.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_128t2048c_1.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_128t2048c_2.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_128t2048c_3.dla
  dlaGenPaths:
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_8t2048c_0.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_8t2048c_1.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_8t2048c_2.dla
    - /data/local/tmp/llm_sdk/vicuna_7b/vicuna-7b-v1.5_sym4W_sym16A_Overall_hessian_i8c_8layer_8t2048c_3.dla
  cachePaths: # One cache file per dla chunk, where each file is a concatenation of all caches in a chunk.